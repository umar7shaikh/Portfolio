  <text x="600" y="500" text-anchor="middle" font-family="Inter, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">Pravak<tspan fill="#22d3ee"> AI</tspan></text>
  <text x="600" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="30" font-weight="500" fill="#7dd3fc" letter-spacing="3">AI VOICE AGENTS THAT HANDLE EVERY CALL</text>
